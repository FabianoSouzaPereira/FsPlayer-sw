name: FsPlayerExample

options:
  createIntermediateGroups: false
  groupSortPosition: top

  postGenCommand: | 
    echo "Podfile.lock ... REMOVED"
    rm -f Podfile.lock
    echo Pods ... REMOVED
    rm -rf Pods
    echo "Installing pods..."
    pod install

  bundleIdPrefix: com.fabianospdev
  deploymentTarget:
    iOS: 16.2
  

settings:
  base:
    ALLWAYS _SEARCH_USER_PATHS: YES
    BUILD_LIBRARY_FOR_DISTRIBUTION: YES
    ENABLE_BITCODE: NO
    GCC_OPTIMIZATION_LEVEL: 0
    SWIFT_OPTIMIZATION_LEVEL: "-Onone"
  DEBUG:
    ENABLE_TESTABILITY: YES
    ONLY_ACTIVE_ARCH: NO
    CLANG_WARM_EMPTY_BODYS: YES
    CLANG_WARM_INFINITE_RECURSION: YES
    CLANG_WARM_NON_LITERAL_NULL_CONVERSATIONS: YES
    CLANG_WARM_RANGE_LOOP_ANALYSIS: YES
    CLANF_WARM_SUSPICIOUS_MOVE: YES
    CLANG_WARM_UNREACHABLE_CODE: YES
    CLANG_WARM_DUPLICATE_METHOD_MATCH: YES
    CLANG_WARM_OBJC_IMPLICIT_RETAIN_SELF: YES
    ENABLE_TESTABILITY: YES
    GCC_WARM_UNUSED_FUNCTION: YES
    GCC_WARM_UNUSED_LABEL: NO
    GCC_WARM_UNUSED_VARIABLE: YES
    CLANG_ENABLE_CODE_COVERAGE: YES
    GCC_GENERATE_TEST_COVERAGE_FILES: YES

configs:
  Debug: debug
  Release: release

targets:
  FsPlayerExample:
    type: application
    platform: iOS
    sources:
      -  path: ./FsPlayerExample
    settings:
      base:
        INFO_PLIST_FILE: FsPlayerExample/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_LAUNCHIMAGE_NAME: LaunchImage
        DEVELOPMENT_TEAM: 9Z2K5Z7V3C
        INFOPLIST_FILE: FsPlayerExample/Info.plist
        PRODUCT_NAME: $(TARGET_NAME)
        PRODUCT_BUNDLE_IDENTIFIER: com.fabianospdev.fsplayerexample
        SWIFT_VERSION: 5.10
        TARGETED_DEVICE_FAMILY: 1
    
    configFiles:
      Debug: Configs/Debug.xcconfig
      Release: Configs/Release.xcconfig

  FsPlayerTests:
    type: bundle.unit-test
    platform: iOS
    dependencies:
      - target: FsPlayerExample
    sources:
      - ../Tests/FsPlayerTests
    info:
      path: ../Tests/FsPlayerTests/Info.plist
      group: Tests
    
    configFiles:
      Debug: Configs/Debug.xcconfig
      Release: Configs/Release.xcconfig

  FsPlayerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - ../Tests/FsPlayerUITests

    info:
      path: ../Tests/FsPlayerUITests/Info.plist
      group: Tests

    dependencies:
      - target: FsPlayerExample
    
    configFiles:
      Debug: Configs/Debug.xcconfig
      Release: Configs/Release.xcconfig

schemes:
  FsPlayerExample:
    build:
      targets:
        FsPlayerExample: all
    buildImplicitDependencies: true
    test:
      gatherCoverageData: true
      coverageTargets:
        - FsPlayerExample
      targets:
        - name: FsPlayerTests
        - name: FsPlayerUITests 
          parallelizable: true 
