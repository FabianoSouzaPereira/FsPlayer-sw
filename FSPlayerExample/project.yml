name: FSPlayerExample
options:
  createIntermediateGroups: false
  groupSortPosition: top
  bundIdPrefix: com.fabianospdev
  deploymentTarget:
    iOS: 16.2
  postGenCommand: pod install

settings:
  base:
    SWIFT_VERSION: 5.10
  configs:
    Debug:
      ENABLE_TESTABILITY: YES
      ONLY_ACTIVE_ARCH: YES
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"

targets:
  FSPlayerExample:
    type: application
    platform: iOS
    sources: 
      - path: FSPlayerExample
    info: 
      path: FSPlayerExample/Info.plist
      properties:
        UIBackgroundModes:
          - audio
        NSPhotoLibraryUsageDescription: FSPlayer lists videos in the photo library so they can be played locally.
        NSAppleMusicUsageDescription: FSPlayer lists songs in the media library so they can be played locally.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fabianospdev.FSPlayerExample
        PRODUCT_NAME: ${TARGET_NAME}
        DEVELOPMENT_TEAM: 9K2X3Z7V4A
        INFO_PLIST_FILE: FSPlayerExample/Info.plist
        TARGETED_DEVICE_FAMILY: 1
  
  FSPlayerExampleTests:
    type: bundle.unit-test
    platform: iOS
    dependencies:
      - target: FSPlayerExample
    sources:
      - path: ../Tests/FSPlayerTests
    info:
      path: ../Tests/FSPlayerTests/Info.plist
      group: Tests

  FSPlayerExampleUITests:
    type: bundle.ui-testing
    platform: iOS
    dependencies:
      - target: FSPlayerExample
    sources:
      - path: ../Tests/FSPlayerUITests
    info:
      path: ../Tests/FSPlayerUITests/Info.plist
      group: Tests

schemes:
  FSPlayerExample:
    build:
      targets:
        FSPlayerExample: all
    buildImplicitDependencies: true
    test:
      gatherCoverageData: true
      coverageTargets:
        - FSPlayerExample
      targets:
        - name: FSPlayerExampleTests
        - name: FSPlayerExampleUITests
          parallelizable: true
